# Nginx: include inside your `server { … }` block and point `root` at the uploaded dist/ folder.
# Note: add_header inside a location replaces the server-level ones, so the security headers are
# repeated in each location. / location 안의 add_header는 server 수준 값을 대체하므로 반복해 둡니다.

root /var/www/app;      # VERIFY: your path / 경로
index index.html;

# Version folders from tools/release.mjs: cache forever. / 버전 폴더는 영구 캐시
location ~ "^/[0-9]+\.[0-9]+\.[0-9]+[^/]*/" {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  try_files $uri =404;
}

# index.html, version.json and everything else: revalidate every time. / 나머지는 매번 재확인
location / {
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  try_files $uri $uri/ =404;
}
