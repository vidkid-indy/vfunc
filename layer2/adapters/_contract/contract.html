<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <!-- style-src 'unsafe-inline' and font-src data: are for AG Grid, which injects its styles and icon font (D-034 10). -->
  <title>Adapter contract tests — vfunc-ui</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../layer1/css/vfunc.tokens.css">
  <link rel="stylesheet" href="../../dist/vfunc-ui.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.5.3/dist/css/tabulator.min.css"

  <link rel="stylesheet" href="./contract.css">
</head>
<body>
  <main class="contract">
    <h1 class="contract__title">Adapter contract tests</h1>
    <p class="contract__lead">The G-1 grid and chart contracts, run in this browser against the built-in vfGrid / vfChart
      and the official adapters with the real vendor libraries (D-034). /
      G-1 그리드·차트 계약을 이 브라우저에서 기본 구현과 공식 어댑터(실제 벤더)로 검사합니다.</p>
    <p class="contract__summary" id="summary" role="status" aria-live="polite">Running…</p>
    <ol class="contract__results" id="results"></ol>
    <div class="contract__stage" id="stage"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@36.2.0/dist/ag-grid-community.min.js"
          integrity="sha384-icvtRKM0YJJgeDhXnWY8UlF1PVBFd4K8Pj61la+vG+EU+awBeoP0xGPZhCD2SQOV" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.5.3/dist/js/tabulator.min.js"
          integrity="sha384-EkhU9cev+ElsgIMdydD5ATwDGjsuvXqtFIqiQn5DXO+xrp52n7Zm407kP4NvBMr/" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"
          integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"
          integrity="sha384-C2iskrW/uPW46KzOjrvJIQo4YkV8lkD+QS0CrDN18IIPIpT/g2USu8bTP3nvmIAD" crossorigin="anonymous"></script>
  <script type="module" src="./contract-page.js"></script>
</body>
</html>
