<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>Component gallery — vfunc-ui</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../layer1/css/vfunc.tokens.css">
  <link rel="stylesheet" href="../../dist/vfunc-ui.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="gallery">
    <header class="gallery__header">
      <div>
        <h1 class="gallery__title">vfunc-ui gallery</h1>
        <p class="gallery__lead">Layer 2 components (preview). vs* return markup, vf* return instances. /
          레이어 2 컴포넌트(미리 보기). vs*는 마크업, vf*는 인스턴스를 돌려줍니다.</p>
      </div>
      <div id="lang"></div>
    </header>

    <p class="gallery__log" id="log" data-ref="log" role="status" aria-live="polite"></p>

    <section class="gallery__section" aria-labelledby="h-input">
      <h2 class="gallery__heading" id="h-input">Input</h2>
      <form class="gallery__form" id="form-static"></form>
      <div class="gallery__grid">
        <div id="number"></div>
        <div id="search"></div>
        <div id="password"></div>
        <div id="chips"></div>
        <div id="masked"></div>
        <div id="date"></div>
        <div id="time"></div>
        <div id="range"></div>
        <div id="rating"></div>
        <div id="select-button"></div>
      </div>
    </section>

    <section class="gallery__section" aria-labelledby="h-display">
      <h2 class="gallery__heading" id="h-display">Display</h2>
      <div id="display-static"></div>
      <div class="gallery__grid">
        <div id="list"></div>
        <div id="carousel"></div>
      </div>
    </section>

    <section class="gallery__section" aria-labelledby="h-navigation">
      <h2 class="gallery__heading" id="h-navigation">Navigation</h2>
      <div id="breadcrumb"></div>
      <div id="tabs"></div>
      <div id="accordion"></div>
      <div id="stepper"></div>
      <div id="pagination"></div>
      <div class="gallery__row">
        <div id="split"></div>
      </div>
    </section>

    <section class="gallery__section" aria-labelledby="h-overlay">
      <h2 class="gallery__heading" id="h-overlay">Overlay</h2>
      <div class="gallery__row" id="overlay-buttons"></div>
      <div class="gallery__row">
        <div id="dropdown"></div>
        <div id="popover"></div>
      </div>
    </section>
  </main>
  <script src="../../../layer1/dist/vfunc.js"></script>
  <script src="../../dist/vfunc-ui.js"></script>
  <script src="../../dist/vfunc-ui.locale.ko.js"></script>
  <script src="../../../layer1/dist/plugins/shortcut.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
